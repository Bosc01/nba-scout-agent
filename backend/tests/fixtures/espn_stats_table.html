<!-- Hand-built structural replica of ESPN's college basketball stats table
     markup (ESPN pages are now fully JS-rendered, so this static-markup path
     only fires on their legacy responses). Exercises the mixed th+td header
     row that _parse_espn_stats_tables must index as one sequence, and the
     whole-number percentages (46.8) it must convert to decimals (0.468). -->
<html><body>
<h1>Jordan Pope</h1>
<table class="Table">
  <tr>
    <th>Season</th><td>GP</td><td>MIN</td><td>PTS</td><td>REB</td><td>AST</td><td>FG%</td><td>3P%</td><td>FT%</td>
  </tr>
  <tr>
    <td>2024-25</td><td>31</td><td>32.9</td><td>17.6</td><td>2.4</td><td>2.6</td><td>44.0</td><td>38.1</td><td>84.4</td>
  </tr>
  <tr>
    <td>2025-26</td><td>36</td><td>29.1</td><td>13.1</td><td>2.1</td><td>1.9</td><td>46.8</td><td>37.2</td><td>84.0</td>
  </tr>
</table>
</body></html>
